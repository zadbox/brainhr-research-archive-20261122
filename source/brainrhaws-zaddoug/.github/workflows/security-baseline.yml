name: Security baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: on-demand-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-runtime-policy:
    name: Production Compose and backup policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Validate production runtime policy
        run: |
          ruby -c scripts/ci/validate_prod_compose.rb
          ruby scripts/ci/validate_prod_compose.rb docker-compose.prod.yml
          python -m unittest \
            tests/prod_compose_validator_test.py \
            tests/backup_manifest_test.py \
            tests/backup_script_test.py \
            tests/database_target_test.py \
            tests/prod_mutation_wrappers_test.py
          python -m unittest tests/release_foundation_policy_test.py
          python -m unittest tests/infra/credential_broker_contract_test.py
          python -m unittest tests/worker_video_hardening_contract_test.py
          bash -n \
            scripts/prod/backup_db.sh \
            scripts/prod/database_target.sh \
            scripts/prod/deploy.sh \
            scripts/prod/restore_db.sh \
            scripts/prod/import_database_url.sh \
            scripts/prod/cutover_to_rds.sh \
            scripts/prod/rehearse_rds_migration.sh \
            scripts/prod/render_env_from_ssm.sh \
            scripts/prod/install_ec2.sh \
            scripts/prod/rollback_release.sh

  backend-security:
    name: Backend targeted security checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt
          python -m pip install pip-audit

      - name: Run targeted security regression tests
        env:
          SECRET_KEY: ci-security-baseline-secret
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./ci_security_baseline.db
          OPENAI_API_KEY: ci-dummy-openai-key
          XAI_API_KEY: ci-dummy-xai-key
        run: |
          pytest \
            tests/runtime_health_test.py \
            tests/test_route_access_control.py \
            tests/test_http_webhook_sender.py \
            tests/test_cv_upload_validation.py \
            tests/test_llm_settings.py \
            tests/test_rgpd_erasure_inventory.py \
            tests/test_rgpd_retention_policy.py \
            tests/release_migration_evidence_contract.py \
            tests/governance/release_candidate_bundle_test.py

      - name: Python dependency audit report
        continue-on-error: true
        run: |
          pip-audit --local

  worker-video-confinement:
    name: Worker video non-root and sandbox smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build exact worker image
        run: docker build --pull --file Dockerfile.worker-video --tag brainrh-worker-video-confinement:${{ github.sha }} .

      - name: Prove runtime confinement with synthetic media
        env:
          IMAGE: brainrh-worker-video-confinement:${{ github.sha }}
        run: |
          sudo install -o root -g root -m 0644 deploy/docker/brainrh-worker-video.apparmor /etc/apparmor.d/brainrh-worker-video
          sudo apparmor_parser --replace /etc/apparmor.d/brainrh-worker-video
          docker image inspect "$IMAGE" --format '{{json .Config.User}}' | grep -Fx '"10001:10001"'
          docker run --rm \
            --entrypoint python \
            --user 10001:10001 \
            --read-only \
            --cap-drop ALL \
            --cap-add SETGID \
            --cap-add SETUID \
            --cap-add SYS_CHROOT \
            --security-opt no-new-privileges \
            --security-opt seccomp=deploy/docker/chromium-seccomp.json \
            --security-opt apparmor=brainrh-worker-video \
            --pids-limit 512 \
            --memory 3g \
            --cpus 2 \
            --shm-size 1g \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
            --env HOME=/tmp/brainrh-home \
            --env XDG_RUNTIME_DIR=/tmp/xdg-runtime \
            --env DISPLAY=:99 \
            --env AWS_EC2_METADATA_DISABLED=true \
            --env CAL_VIDEO_CHROMIUM_EXECUTABLE=/usr/local/bin/brainrh-chromium \
            "$IMAGE" /app/scripts/ci/worker_video_container_smoke.py

  frontend-security:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend high severity audit
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build
