                        BACKEND_DIGEST='${EmergencyFullReleaseBackendDigest}' BACKEND_CRITICAL='${EmergencyFullReleaseBackendCriticalCount}' BACKEND_HIGH='${EmergencyFullReleaseBackendHighCount}' \
                        FRONTEND_DIGEST='${EmergencyFullReleaseFrontendDigest}' FRONTEND_CRITICAL='${EmergencyFullReleaseFrontendCriticalCount}' FRONTEND_HIGH='${EmergencyFullReleaseFrontendHighCount}' \
                        WORKER_DIGEST='${EmergencyFullReleaseWorkerDigest}' WORKER_CRITICAL='${EmergencyFullReleaseWorkerCriticalCount}' WORKER_HIGH='${EmergencyFullReleaseWorkerHighCount}' \
                        RISK_ACCEPTANCE_ID='${EmergencyFullReleaseRiskAcceptanceId}' \
                        EXPECTED_COMPOSE_SHA256='${EmergencyFullReleaseComposeSha256}' EXPECTED_SECCOMP_SHA256='${EmergencyFullReleaseSeccompSha256}' \
