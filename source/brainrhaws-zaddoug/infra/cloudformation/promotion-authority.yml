  FastReleaseDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub BrainRH-${Environment}-PromoteFastRelease
      DocumentType: Automation
      DocumentFormat: YAML
      UpdateMethod: NewVersion
      TargetType: /AWS::EC2::Instance
      Content:
        schemaVersion: "0.3"
        description: >-
          Promote, recover or roll back one exact manifest-bound release. This
          stable document is installed once; normal releases do not update the
          CloudFormation stack.
        assumeRole: !GetAtt AutomationExecutionRole.Arn
        parameters:
          ManifestKey:
            type: String
            description: Versioned compact release manifest key.
            allowedPattern: "^release-authority/dev-releases/[0-9a-f]{40}/manifest\\.json$"
          ManifestVersionId:
            type: String
            description: Exact S3 VersionId of the compact release manifest.
            allowedPattern: "^[A-Za-z0-9._~+/=-]{1,1024}$"
          ManifestSha256:
            type: String
            description: Lower-case SHA-256 of the canonical manifest bytes.
            allowedPattern: "^[0-9a-f]{64}$"
          Mode:
            type: String
            default: promote
            allowedValues: [promote, recover, rollback]
        mainSteps:
          - name: RunFastRelease
            action: aws:runCommand
            timeoutSeconds: 3600
            inputs:
              DocumentName: AWS-RunShellScript
              InstanceIds:
                - !Ref ProductionInstanceId
              CloudWatchOutputConfig:
                CloudWatchOutputEnabled: true
                CloudWatchLogGroupName: !Ref PromotionLogGroup
              Parameters:
                commands:
                  - set -eu
                  - umask 077
                  - !Sub |
                      test "$(id -u)" -eq 0
                      manifest_key='{{ ManifestKey }}'
                      manifest_version_id='{{ ManifestVersionId }}'
                      manifest_sha256='{{ ManifestSha256 }}'
                      mode='{{ Mode }}'
                      tmp="$(mktemp -d /var/tmp/brainrh-fast-release.XXXXXX)"
                      docker_config="$(mktemp -d /var/tmp/brainrh-fast-release-docker.XXXXXX)"
                      extract_container=''
                      cleanup() {
                        test -z "$extract_container" || docker rm -f "$extract_container" >/dev/null 2>&1 || true
                        rm -rf -- "$tmp" "$docker_config"
                      }
                      trap cleanup EXIT HUP INT TERM
                      downloaded_version="$(aws s3api get-object --bucket '${AuthorityBucket}' --key "$manifest_key" --version-id "$manifest_version_id" --query VersionId --output text "$tmp/manifest.json")"
                      test "$downloaded_version" = "$manifest_version_id"
                      printf '%s  %s\n' "$manifest_sha256" "$tmp/manifest.json" | sha256sum --check --strict -
                      jq -e '
                        .schema_version == 1 and
                        (.candidate_sha | test("^[0-9a-f]{40}$")) and
                        .images.backend.repository == "brainrh/backend" and
                        .images.frontend.repository == "brainrh/frontend" and
                        .images.worker.repository == "brainrh/worker-video" and
                        ([.images.backend.digest,.images.frontend.digest,.images.worker.digest] | all(test("^sha256:[0-9a-f]{64}$"))) and
                        ([.images.backend.source_sha,.images.frontend.source_sha,.images.worker.source_sha] | all(test("^[0-9a-f]{40}$"))) and
                        ([.scans.backend,.scans.frontend,.scans.worker] | all(.status == "COMPLETE" and (.critical | type == "number") and (.high | type == "number"))) and
                        (.migration.tree_fingerprint | test("^(NONE|sha256:[0-9a-f]{64})$")) and
                        (.migration.target_revision | test("^[0-9a-f]{12}$")) and
                        .migration.strategy == "if_tree_changed" and
                        (.artifacts.compose_sha256 | test("^[0-9a-f]{64}$")) and
                        (.artifacts.seccomp_sha256 | test("^[0-9a-f]{64}$"))
                      ' "$tmp/manifest.json" >/dev/null
                      candidate_sha="$(jq -er .candidate_sha "$tmp/manifest.json")"
                      test "$manifest_key" = "release-authority/dev-releases/$candidate_sha/manifest.json"
                      risk_id="$(jq -er .risk_acceptance.id "$tmp/manifest.json")"
                      risk_expires="$(jq -er .risk_acceptance.expires_at "$tmp/manifest.json")"
                      total_blocking="$(jq '[.scans.backend,.scans.frontend,.scans.worker] | map(.critical + .high) | add' "$tmp/manifest.json")"
                      if test "$total_blocking" -gt 0; then
                        printf '%s' "$risk_id" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$'
                        test "$risk_id" != NONE
                        if test "$mode" = promote; then
                          test "$(date -u -d "$risk_expires" +%s)" -gt "$(date -u +%s)"
                        fi
                      else
                        risk_id=NO-WAIVER
                        risk_expires=NONE
                      fi
                      backend_digest="$(jq -er .images.backend.digest "$tmp/manifest.json")"
                      registry='${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com'
                      backend_ref="$registry/brainrh/backend@$backend_digest"
                      worker_ref="$registry/brainrh/worker-video@$(jq -er .images.worker.digest "$tmp/manifest.json")"
                      backend_id="$(docker ps -q --filter 'label=com.docker.compose.project=brainrh' --filter 'label=com.docker.compose.service=backend')"
                      worker_id="$(docker ps -q --filter 'label=com.docker.compose.project=brainrh' --filter 'label=com.docker.compose.service=worker-video')"
                      test -n "$backend_id"; test -n "$worker_id"
                      test "$(printf '%s\n' "$backend_id" | wc -l | tr -d ' ')" = 1
                      test "$(printf '%s\n' "$worker_id" | wc -l | tr -d ' ')" = 1
                      test "$(docker inspect "$backend_id" | jq -er '.[0].Config.Image')" = "$backend_ref"
                      test "$(docker inspect "$worker_id" | jq -er '.[0].Config.Image')" = "$worker_ref"
                      backend_source_sha="$(jq -er .images.backend.source_sha "$tmp/manifest.json")"
                      actual_digest="$(aws ecr describe-images --region '${AWS::Region}' --repository-name brainrh/backend --image-ids "imageTag=sha-$backend_source_sha" --query 'imageDetails[0].imageDigest' --output text)"
                      test "$actual_digest" = "$backend_digest"
                      export DOCKER_CONFIG="$docker_config"
                      aws ecr get-login-password --region '${AWS::Region}' | docker login --username AWS --password-stdin "$registry" >/dev/null
                      docker pull "$backend_ref" >/dev/null
                      extract_container="$(docker create "$backend_ref")"
                      docker cp "$extract_container:/app/scripts/prod/promote_exact_release.sh" "$tmp/promote_exact_release.sh"
                      docker rm "$extract_container" >/dev/null
                      extract_container=''
                      chmod 0500 "$tmp/promote_exact_release.sh"
                      env \
                        CANDIDATE_SHA="$candidate_sha" \
                        EXPECTED_BASE_REVISION=AUTO \
                        EXPECTED_HEAD_REVISION="$(jq -er .migration.target_revision "$tmp/manifest.json")" \
                        MIGRATION_TREE_FINGERPRINT="$(jq -er .migration.tree_fingerprint "$tmp/manifest.json")" \
                        RELEASE_SCOPE="$(jq -er .scope "$tmp/manifest.json")" \
                        BACKEND_DIGEST="$backend_digest" \
                        BACKEND_SOURCE_SHA="$(jq -er .images.backend.source_sha "$tmp/manifest.json")" \
                        BACKEND_CRITICAL="$(jq -er .scans.backend.critical "$tmp/manifest.json")" \
                        BACKEND_HIGH="$(jq -er .scans.backend.high "$tmp/manifest.json")" \
                        FRONTEND_DIGEST="$(jq -er .images.frontend.digest "$tmp/manifest.json")" \
                        FRONTEND_SOURCE_SHA="$(jq -er .images.frontend.source_sha "$tmp/manifest.json")" \
                        FRONTEND_CRITICAL="$(jq -er .scans.frontend.critical "$tmp/manifest.json")" \
                        FRONTEND_HIGH="$(jq -er .scans.frontend.high "$tmp/manifest.json")" \
                        WORKER_DIGEST="$(jq -er .images.worker.digest "$tmp/manifest.json")" \
                        WORKER_SOURCE_SHA="$(jq -er .images.worker.source_sha "$tmp/manifest.json")" \
                        WORKER_CRITICAL="$(jq -er .scans.worker.critical "$tmp/manifest.json")" \
                        WORKER_HIGH="$(jq -er .scans.worker.high "$tmp/manifest.json")" \
                        RISK_ACCEPTANCE_ID="$risk_id" \
                        RISK_ACCEPTANCE_EXPIRES_AT="$risk_expires" \
                        EXPECTED_COMPOSE_SHA256="$(jq -er .artifacts.compose_sha256 "$tmp/manifest.json")" \
                        EXPECTED_SECCOMP_SHA256="$(jq -er .artifacts.seccomp_sha256 "$tmp/manifest.json")" \
                        RDS_INSTANCE_ID='${ProductionDbInstanceIdentifier}' \
                        AUTHORITY_BUCKET='${AuthorityBucket}' \
                        AWS_REGION='${AWS::Region}' \
                        AWS_ACCOUNT_ID='${AWS::AccountId}' \
                        BRAINRH_PUBLIC_ORIGIN='https://brainhr.braingentech.com' \
                        bash "$tmp/promote_exact_release.sh" "$mode"

  BootstrapVerifierDocument:
    Type: AWS::SSM::Document
    Condition: HasVerifierBootstrapEvidence
    Properties:
      Name: !Sub BrainRH-${Environment}-BootstrapReleaseAuthority
      DocumentType: Automation
      DocumentFormat: YAML
      UpdateMethod: NewVersion
      TargetType: /AWS::EC2::Instance
      Content:
        schemaVersion: "0.3"
        description: >-
          Install one externally signed verifier artifact. The artifact identity,
          hashes, signature and S3 versions are fixed CloudFormation parameters;
          this document exposes no caller-controlled command or artifact parameter.
        assumeRole: !GetAtt AutomationExecutionRole.Arn
        mainSteps:
          - name: InstallExactSignedVerifier
            action: aws:runCommand
            timeoutSeconds: 600
            inputs:
              DocumentName: AWS-RunShellScript
              InstanceIds:
                - !Ref ProductionInstanceId
              CloudWatchOutputConfig:
                CloudWatchOutputEnabled: true
                CloudWatchLogGroupName: !Ref PromotionLogGroup
              Parameters:
                commands:
                  - set -eu
                  - umask 077
                  - !Sub |
                      tmp="$(mktemp -d /usr/local/sbin/.brainrh-release-authority.bootstrap.XXXXXX)"
                      cleanup() { rm -rf -- "$tmp"; }
                      trap cleanup EXIT HUP INT TERM
                      test "$(id -u)" -eq 0
                      test -x /usr/bin/ruby
                      openssl version | grep -Eq '^OpenSSL 3\.'
                      artifact_key='release-authority/bootstrap/${VerifierSourceSha}/brainrh-release-authority'
                      signature_key='release-authority/bootstrap/${VerifierSourceSha}/brainrh-release-authority.sig'
                      artifact_version="$(aws s3api get-object --bucket '${AuthorityBucket}' --key "$artifact_key" --version-id '${VerifierArtifactVersionId}' --query VersionId --output text "$tmp/verifier")"
                      signature_version="$(aws s3api get-object --bucket '${AuthorityBucket}' --key "$signature_key" --version-id '${VerifierSignatureVersionId}' --query VersionId --output text "$tmp/verifier.sig")"
                      test "$artifact_version" = '${VerifierArtifactVersionId}'
                      test "$signature_version" = '${VerifierSignatureVersionId}'
                      test "$(wc -c < "$tmp/verifier.sig" | tr -d ' ')" = 64
                      printf '%s  %s\n' '${VerifierArtifactSha256}' "$tmp/verifier" | sha256sum --check --strict -
                      printf '%s  %s\n' '${VerifierSignatureSha256}' "$tmp/verifier.sig" | sha256sum --check --strict -
                      printf '\060\052\060\005\006\003\053\145\160\003\041\000' > "$tmp/public-key.der"
                      printf '%s' '${TrustPublicKeyBase64}' | base64 --decode >> "$tmp/public-key.der"
                      test "$(wc -c < "$tmp/public-key.der" | tr -d ' ')" = 44
                      openssl pkeyutl -verify -pubin -inkey "$tmp/public-key.der" -keyform DER -rawin -in "$tmp/verifier" -sigfile "$tmp/verifier.sig"
                      chown root:root "$tmp/verifier"
                      chmod 0755 "$tmp/verifier"
                      sync -f "$tmp/verifier"
                      mv -fT "$tmp/verifier" /usr/local/sbin/brainrh-release-authority
                      sync -f /usr/local/sbin
                      printf '%s  %s\n' '${VerifierArtifactSha256}' /usr/local/sbin/brainrh-release-authority | sha256sum --check --strict -
                      test "$(/usr/local/sbin/brainrh-release-authority version)" = '${VerifierSourceSha}'

  AutomationExecutionPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub brainrh-${Environment}-promotion-automation
      Roles:
        - !Ref AutomationExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RunOnlyClosedCommandsOnProduction
            Effect: Allow
            Action: ssm:SendCommand
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${ProductionInstanceId}
          - Sid: ObserveCommandCompletion
            Effect: Allow
            Action:
              - ssm:GetCommandInvocation
              - ssm:ListCommands
              - ssm:ListCommandInvocations
            Resource: "*"
          - Sid: VerifyManagedInstanceAvailability
            Effect: Allow
            Action: ssm:DescribeInstanceInformation
            Resource: "*"
          - Sid: PublishPromotionCommandLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:DescribeLogStreams
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${PromotionLogGroup}:*
          - Sid: ObserveProductionMetadataOptions
            Effect: Allow
            Action: ec2:DescribeInstances
            Resource: "*"

  AuthorityEvidencePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub brainrh-${Environment}-promotion-authority
      Roles:
        - !Ref PromotionAuthorityRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AppendExternallySignedAuthorityEvidence
            Effect: Allow
            Action:
              - s3:GetObjectVersion
              - s3:PutObject
            Resource:
              - !Sub ${AuthorityBucket.Arn}/release-authority/releases/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/authorizations/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/revocations/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/sources/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/bootstrap/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/seeds/*
          - Sid: ReadAuthorityBucketVersioning
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:GetBucketVersioning
            Resource: !GetAtt AuthorityBucket.Arn
          - Sid: ListSignedEvidenceVersions
            Effect: Allow
            Action: s3:ListBucketVersions
            Resource: !GetAtt AuthorityBucket.Arn
            Condition:
              StringLike:
                s3:prefix:
                  - release-authority/releases/*
                  - release-authority/authorizations/*
                  - release-authority/revocations/*
                  - release-authority/sources/*
                  - release-authority/bootstrap/*
                  - release-authority/seeds/*
          - Sid: VerifyEvidenceBeforeClosedSeed
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ecr:DescribeImages
              - ecr:DescribeImageScanFindings
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TrustPublicKeyParameter}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SeedExecutionPrincipalParameter}
              - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/brainrh/*
          - Sid: SeedOnlyExactPromotionStateItems
            Effect: Allow
            Action:
              - dynamodb:ConditionCheckItem
              - dynamodb:PutItem
            Resource: !GetAtt PromotionStateTable.Arn
            Condition:
              StringEquals:
                dynamodb:EnclosingOperation: TransactWriteItems
          - Sid: ObserveOwnPromotionAutomations
            Effect: Allow
            Action: ssm:GetAutomationExecution
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*
          - Sid: PassOnlyPromotionAutomationRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt AutomationExecutionRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: ssm.amazonaws.com

  RuntimeAutomationStartPolicy:
    Type: AWS::IAM::Policy
    Condition: RuntimePromotionEnabled
    Properties:
      PolicyName: !Sub brainrh-${Environment}-start-runtime-promotion
      Roles:
        - !Ref PromotionAuthorityRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StartOnlyClosedRuntimeAutomations
            Effect: Allow
            Action: ssm:StartAutomationExecution
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${PromoteReleaseDocument}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${PromoteReleaseDocument}:*
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${RollbackReleaseDocument}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${RollbackReleaseDocument}:*
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${RecoverReleaseDocument}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${RecoverReleaseDocument}:*
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*

  BootstrapAutomationStartPolicy:
    Type: AWS::IAM::Policy
    Condition: HasVerifierBootstrapEvidence
    Properties:
      PolicyName: !Sub brainrh-${Environment}-start-verifier-bootstrap
      Roles:
        - !Ref PromotionAuthorityRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StartOnlyClosedVerifierBootstrap
            Effect: Allow
            Action: ssm:StartAutomationExecution
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${BootstrapVerifierDocument}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${BootstrapVerifierDocument}:*
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*

  HostPreparationAutomationStartPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub brainrh-${Environment}-start-host-preparation
      Roles:
        - !Ref PromotionAuthorityRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StartOnlyClosedHostPreparation
            Effect: Allow
            Action: ssm:StartAutomationExecution
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${PrepareExistingHostDocument}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${PrepareExistingHostDocument}:*
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*

  SyntheticWorkerVideoSmokeStartPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub brainrh-${Environment}-start-synthetic-worker-video-smoke
      Roles:
        - !Ref PromotionAuthorityRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StartOnlyClosedSyntheticWorkerVideoSmoke
            Effect: Allow
            Action: ssm:StartAutomationExecution
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${SyntheticWorkerVideoSmokeDocument}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${SyntheticWorkerVideoSmokeDocument}:*
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*

  EmergencyWorkerVideoRolloutStartPolicy:
    Type: AWS::IAM::Policy
    Condition: EmergencyWorkerVideoRolloutEnabled
    Properties:
      PolicyName: !Sub brainrh-${Environment}-start-worker-video-security-rollout
      Roles:
        - !Ref PromotionAuthorityRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StartOnlyClosedWorkerVideoSecurityRollout
            Effect: Allow
            Action: ssm:StartAutomationExecution
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${EmergencyWorkerVideoRolloutDocument}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${EmergencyWorkerVideoRolloutDocument}:*
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*

  EmergencyBackendRolloutStartPolicy:
    Type: AWS::IAM::Policy
    Condition: EmergencyBackendRolloutEnabled
    Properties:
      PolicyName: !Sub brainrh-${Environment}-start-backend-rgpd-inventory-rollout
      Roles:
        - !Ref PromotionAuthorityRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StartOnlyClosedBackendRgpdInventoryRollout
            Effect: Allow
            Action: ssm:StartAutomationExecution
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${EmergencyBackendRolloutDocument}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${EmergencyBackendRolloutDocument}:*
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*

  EmergencyFullReleaseStartPolicy:
    Type: AWS::IAM::Policy
    Condition: EmergencyFullReleaseEnabled
    Properties:
      PolicyName: !Sub brainrh-${Environment}-start-exact-full-release
      Roles:
        - !Ref PromotionAuthorityRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StartOnlyClosedExactFullReleaseAutomations
            Effect: Allow
            Action: ssm:StartAutomationExecution
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${EmergencyFullReleaseDocument}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${EmergencyFullReleaseDocument}:*
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${EmergencyFullReleaseRecoveryDocument}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${EmergencyFullReleaseRecoveryDocument}:*
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${EmergencyFullReleaseRollbackDocument}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${EmergencyFullReleaseRollbackDocument}:*
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*

  GithubFastReleasePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub brainrh-${Environment}-fast-release
      Roles:
        - !Ref GithubReleaseRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AppendExactFastReleaseManifest
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub ${AuthorityBucket.Arn}/release-authority/dev-releases/*
          - Sid: DiscoverFastReleaseBucket
            Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
          - Sid: StartOnlyStableManifestBoundRelease
            Effect: Allow
            Action: ssm:StartAutomationExecution
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${FastReleaseDocument}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${FastReleaseDocument}:*
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*
          - Sid: ObserveFastRelease
            Effect: Allow
            Action: ssm:GetAutomationExecution
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*
          - Sid: PassOnlyFastReleaseAutomationRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt AutomationExecutionRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: ssm.amazonaws.com

  CredentialBrokerAutomationStartPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub brainrh-${Environment}-start-credential-broker
      Roles:
        - !Ref PromotionAuthorityRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StartOnlyClosedCredentialBrokerInstallation
            Effect: Allow
            Action: ssm:StartAutomationExecution
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${InstallCredentialBrokerDocument}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${InstallCredentialBrokerDocument}:*
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*

  ProductionVerificationPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub brainrh-${Environment}-release-verification
      Roles:
        - !Ref ExistingEc2RoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadExactAuthorityObjectVersions
            Effect: Allow
            Action: s3:GetObjectVersion
            Resource:
              - !Sub ${AuthorityBucket.Arn}/release-authority/releases/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/authorizations/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/revocations/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/sources/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/dev-releases/*
              - !If
                - HasVerifierBootstrapEvidence
                - !Sub ${AuthorityBucket.Arn}/release-authority/bootstrap/${VerifierSourceSha}/brainrh-release-authority
                - !Ref AWS::NoValue
              - !If
                - HasVerifierBootstrapEvidence
                - !Sub ${AuthorityBucket.Arn}/release-authority/bootstrap/${VerifierSourceSha}/brainrh-release-authority.sig
                - !Ref AWS::NoValue
          - Sid: DiscoverCurrentRevocations
            Effect: Allow
            Action: s3:ListBucketVersions
            Resource: !GetAtt AuthorityBucket.Arn
            Condition:
              StringLike:
                s3:prefix: release-authority/revocations/*
          - Sid: ReadExternalTrustAnchor
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TrustPublicKeyParameter}
          - Sid: VerifyImmutableEcrEvidence
            Effect: Allow
            Action:
              - ecr:DescribeImages
              - ecr:DescribeImageScanFindings
            Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/brainrh/*
          - Sid: VerifyRdsPointInTimeRecovery
            Effect: Allow
            Action: rds:DescribeDBInstances
            Resource: "*"
          - Sid: AppendFastReleaseReceipt
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub ${AuthorityBucket.Arn}/release-authority/receipts/fast/*
          - Sid: RuntimeMayNeverWriteSignedAuthorityEvidence
            Effect: Deny
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:PutObject
            Resource:
              - !Sub ${AuthorityBucket.Arn}/release-authority/releases/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/authorizations/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/revocations/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/sources/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/bootstrap/*
          - Sid: RuntimeMayNeverReadAuthorityEvidenceWithoutVersion
            Effect: Deny
            Action: s3:GetObject
            Resource: !Sub ${AuthorityBucket.Arn}/release-authority/*
          - Sid: RuntimeMayNeverModifyTrustAnchor
            Effect: Deny
            Action:
              - ssm:DeleteParameter
              - ssm:PutParameter
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TrustPublicKeyParameter}

  HostPreparationLogsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub brainrh-${Environment}-host-preparation-logs
      Roles:
        - !Ref ExistingEc2RoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublishOnlyHostPreparationCommandOutput
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:DescribeLogStreams
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${PromotionLogGroup}:*

  EmergencyFullReleaseHostPreflightPolicy:
    Type: AWS::IAM::Policy
    Condition: EmergencyFullReleaseEnabled
    Properties:
      PolicyName: !Sub brainrh-${Environment}-exact-release-host-preflight
      Roles:
        - !Ref ExistingEc2RoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: VerifyExactReleaseHostMetadataIsolation
            Effect: Allow
            Action: ec2:DescribeInstances
            Resource: "*"

  EmergencyFullReleaseBackupPreflightPolicy:
    Type: AWS::IAM::Policy
    Condition: EmergencyFullReleaseEnabled
    Properties:
      PolicyName: !Sub brainrh-${Environment}-exact-release-backup-preflight
      Roles:
        - !Ref ExistingEc2RoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: VerifyVersionedProductionBackupBucket
            Effect: Allow
            Action:
              - s3:GetBucketVersioning
            Resource: !Sub arn:${AWS::Partition}:s3:::brainrh-${Environment}-backups-${AWS::AccountId}-${AWS::Region}
          - Sid: VerifyExactProductionBackupObjectVersions
            Effect: Allow
            Action: s3:GetObjectVersion
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::brainrh-${Environment}-backups-${AWS::AccountId}-${AWS::Region}/postgres/daily/*
              - !Sub arn:${AWS::Partition}:s3:::brainrh-${Environment}-backups-${AWS::AccountId}-${AWS::Region}/postgres/weekly/*

  HostAssumeBackendDataRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub brainrh-${Environment}-assume-backend-data
      Roles:
        - !Ref ExistingEc2RoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeOnlyBackendDataRole
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt BackendDataRole.Arn

  RuntimeMutationPolicy:
    Type: AWS::IAM::Policy
    Condition: RuntimePromotionEnabled
    Properties:
      PolicyName: !Sub brainrh-${Environment}-runtime-promotion-mutation
      Roles:
        - !Ref ExistingEc2RoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadExactPromotionReceiptsForRecovery
            Effect: Allow
            Action: s3:GetObjectVersion
            Resource: !Sub ${AuthorityBucket.Arn}/release-authority/receipts/*
          - Sid: DiscoverExactPromotionReceipts
            Effect: Allow
            Action: s3:ListBucketVersions
            Resource: !GetAtt AuthorityBucket.Arn
            Condition:
              StringLike:
                s3:prefix: release-authority/receipts/*
          - Sid: VerifyProductionInstanceMetadataIsolation
            Effect: Allow
            Action: ec2:DescribeInstances
            Resource: "*"
          - Sid: AtomicallyTransitionPromotionState
            Effect: Allow
            Action: dynamodb:UpdateItem
            Resource: !GetAtt PromotionStateTable.Arn
            Condition:
              StringEquals:
                dynamodb:EnclosingOperation: TransactWriteItems
          - Sid: ReadConsumedAuthorizationForRecovery
            Effect: Allow
            Action: dynamodb:GetItem
            Resource: !GetAtt PromotionStateTable.Arn
          - Sid: AppendPromotionReceipts
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub ${AuthorityBucket.Arn}/release-authority/receipts/*
          - Sid: PublishRuntimeCommandOutput
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:DescribeLogStreams
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${PromotionLogGroup}:*

  BootstrapVerificationLogsPolicy:
    Type: AWS::IAM::Policy
    Condition: HasVerifierBootstrapEvidence
    Properties:
      PolicyName: !Sub brainrh-${Environment}-bootstrap-verifier-logs
      Roles:
        - !Ref ExistingEc2RoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublishBootstrapVerificationOutput
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:DescribeLogStreams
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${PromotionLogGroup}:*

  AuthorityBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref AuthorityBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RequireTransportSecurity
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AuthorityBucket.Arn
              - !Sub ${AuthorityBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: OnlyExternalAuthorityMayAppendSignedEvidence
            Effect: Deny
            Principal: "*"
            Action:
              - s3:AbortMultipartUpload
              - s3:PutObject
              - s3:PutObjectAcl
              - s3:PutObjectTagging
            Resource:
              - !Sub ${AuthorityBucket.Arn}/release-authority/releases/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/authorizations/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/revocations/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/sources/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/bootstrap/*
            Condition:
              ArnNotEquals:
                aws:PrincipalArn: !GetAtt PromotionAuthorityRole.Arn
          - Sid: OnlyProductionRuntimeMayAppendReceipts
            Effect: Deny
            Principal: "*"
            Action:
              - s3:AbortMultipartUpload
              - s3:PutObject
              - s3:PutObjectAcl
              - s3:PutObjectTagging
            Resource: !Sub ${AuthorityBucket.Arn}/release-authority/receipts/*
            Condition:
              ArnNotEquals:
                aws:PrincipalArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ExistingEc2RoleName}
          - Sid: AuthorizationAndSourceWritesMustBeCreateOnly
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource:
              - !Sub ${AuthorityBucket.Arn}/release-authority/authorizations/*
              - !Sub ${AuthorityBucket.Arn}/release-authority/sources/*
            Condition:
              StringNotEquals:
                s3:if-none-match: "*"
          - Sid: FastReleaseManifestWritesMustBeCreateOnly
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub ${AuthorityBucket.Arn}/release-authority/dev-releases/*
            Condition:
              StringNotEquals:
                s3:if-none-match: "*"
          - Sid: OnlyExternalAuthorityMayAppendSeedJournal
            Effect: Deny
            Principal: "*"
            Action:
              - s3:AbortMultipartUpload
              - s3:PutObject
              - s3:PutObjectAcl
              - s3:PutObjectTagging
            Resource: !Sub ${AuthorityBucket.Arn}/release-authority/seeds/*
            Condition:
              ArnNotEquals:
                aws:PrincipalArn: !GetAtt PromotionAuthorityRole.Arn
          - Sid: ReceiptWritesMustBeCreateOnly
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub ${AuthorityBucket.Arn}/release-authority/receipts/*
            Condition:
              StringNotEquals:
                s3:if-none-match: "*"
          - Sid: SeedJournalWritesMustBeCreateOnly
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub ${AuthorityBucket.Arn}/release-authority/seeds/*
            Condition:
              StringNotEquals:
                s3:if-none-match: "*"
          - Sid: AuthorityEvidenceIsAppendOnly
            Effect: Deny
            Principal: "*"
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
            Resource: !Sub ${AuthorityBucket.Arn}/release-authority/*
          - Sid: UnversionedAuthorityReadsAreForbidden
            Effect: Deny
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${AuthorityBucket.Arn}/release-authority/*

Outputs:
  AuthorityBucketName:
    Description: Versioned bucket that stores release manifests and signatures.
    Value: !Ref AuthorityBucket
  AuthorityPrefix:
    Value: release-authority/
  FastReleaseDocumentName:
    Description: Stable manifest-bound release Automation installed once.
    Value: !Ref FastReleaseDocument
  TrustKeyId:
    Value: !Ref TrustKeyId
  TrustPublicKeyParameterName:
    Value: !Ref TrustPublicKeyParameter
  SeedExecutionPrincipalParameterName:
    Value: !Ref SeedExecutionPrincipalParameter
  PromotionAuthorityRoleArn:
    Value: !GetAtt PromotionAuthorityRole.Arn
  PromoteReleaseDocumentName:
    Condition: RuntimePromotionEnabled
    Value: !Ref PromoteReleaseDocument
  RollbackReleaseDocumentName:
    Condition: RuntimePromotionEnabled
    Value: !Ref RollbackReleaseDocument
  RecoverReleaseDocumentName:
    Condition: RuntimePromotionEnabled
    Value: !Ref RecoverReleaseDocument
  BootstrapVerifierDocumentName:
    Condition: HasVerifierBootstrapEvidence
    Value: !Ref BootstrapVerifierDocument
  PrepareExistingHostDocumentName:
    Value: !Ref PrepareExistingHostDocument
  SyntheticWorkerVideoSmokeDocumentName:
    Value: !Ref SyntheticWorkerVideoSmokeDocument
  EmergencyWorkerVideoRolloutDocumentName:
    Condition: EmergencyWorkerVideoRolloutEnabled
    Value: !Ref EmergencyWorkerVideoRolloutDocument
  EmergencyBackendRolloutDocumentName:
    Condition: EmergencyBackendRolloutEnabled
    Value: !Ref EmergencyBackendRolloutDocument
  EmergencyFullReleaseDocumentName:
    Condition: EmergencyFullReleaseEnabled
    Value: !Ref EmergencyFullReleaseDocument
  EmergencyFullReleaseRecoveryDocumentName:
    Condition: EmergencyFullReleaseEnabled
    Value: !Ref EmergencyFullReleaseRecoveryDocument
  EmergencyFullReleaseRollbackDocumentName:
    Condition: EmergencyFullReleaseEnabled
    Value: !Ref EmergencyFullReleaseRollbackDocument
  InstallCredentialBrokerDocumentName:
    Value: !Ref InstallCredentialBrokerDocument
  BackendDataRoleArn:
    Value: !GetAtt BackendDataRole.Arn
  BackendDataRoleName:
    Value: !Ref BackendDataRole
  PromotionLogGroupName:
    Value: !Ref PromotionLogGroup
  PromotionStateTableName:
    Value: !Ref PromotionStateTable
  RuntimePromotionEnabled:
    Value: !Ref EnableRuntimePromotion
